<meta name="mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:"Gowun Batang";font-weight:700;font-display:swap;src:url(gowun-batang-bold.woff2) format("woff2")}
/* 선명한 그라데이션: 파랑→남색 머리띠, 보라 오늘 카드, 초록 완료·주황 헷갈려요 버튼, 블루그레이 바탕 */
:root{
  --bg:#f0f1fa; --bg-grad:linear-gradient(180deg,#eceff9 0%,#f1effb 55%,#f7f5fd 100%);
  --surface:#fff; --ink:#1f1d33; --muted:#6c6a86; --line:#e3e4f2;
  --accent:#4f46e5; --on-accent:#fff; --container:#e0e7ff; --on-container:#1e1b6b;
  --head:linear-gradient(120deg,#2563eb,#4f46e5); --head-shadow:rgb(79 70 229 / .28);
  --grad:linear-gradient(120deg,#2563eb,#4f46e5); --grad-shadow:rgb(79 70 229 / .3);
  --green:linear-gradient(120deg,#22c55e,#16a34a); --green-shadow:rgb(22 163 74 / .3);
  --orange:linear-gradient(120deg,#f97316,#ef4444); --orange-shadow:rgb(239 68 68 / .28);
  --hero:linear-gradient(120deg,#a855f7,#9333ea); --hero-ink:#fff; --hero-shadow:0 8px 22px rgb(147 51 234 / .3); --hero-a:#e9d5ff;
  --today-bg:#ffe0d1; --today-fg:#8a3a17; --late-bg:#ffdad6; --late-fg:#93000a;
  --soon-bg:#e4dfff; --soon-fg:#3e3487; --done-bg:#d8f0e3; --done-fg:#1f6b45;
  --dot-off:#e2ddf2; --danger:#ba1a1a; --scrim:rgb(34 29 51 / .42);
  --s0:#e4dfff; --s0i:#3e3487; --s1:#ffe0ea; --s1i:#7d2950; --s2:#d8f0e3; --s2i:#1f6b45; --s3:#fff0c9; --s3i:#6b5200;
  --shadow:0 3px 12px rgb(60 60 140 / .08);
  --display:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14151f; --bg-grad:linear-gradient(180deg,#161a2c 0%,#14151f 60%);
  --surface:#1f2030; --ink:#e8e8f6; --muted:#a2a2bb; --line:#30324a;
  --accent:#a5b4fc; --on-accent:#1e1b6b; --container:#312e81; --on-container:#e0e7ff;
  --head:linear-gradient(120deg,#1d4ed8,#4338ca); --head-shadow:rgb(0 0 0 / .3);
  --grad:linear-gradient(120deg,#2563eb,#4f46e5); --grad-shadow:rgb(0 0 0 / .3);
  --green:linear-gradient(120deg,#16a34a,#15803d); --green-shadow:rgb(0 0 0 / .3);
  --orange:linear-gradient(120deg,#ea580c,#dc2626); --orange-shadow:rgb(0 0 0 / .3);
  --hero:linear-gradient(120deg,#7e22ce,#6b21a8); --hero-ink:#fff; --hero-shadow:none; --hero-a:#e9d5ff;
  --today-bg:#4d2b1d; --today-fg:#ffb998; --late-bg:#5c1f1b; --late-fg:#ffb4ab;
  --soon-bg:#2f2860; --soon-fg:#d5ceff; --done-bg:#1d3a2b; --done-fg:#9fd9b8;
  --dot-off:#3a3450; --danger:#ffb4ab; --scrim:rgb(0 0 0 / .55);
  --s0:#2f2860; --s0i:#d5ceff; --s1:#4a2236; --s1i:#ffcfe0; --s2:#1d3a2b; --s2i:#9fd9b8; --s3:#3d3214; --s3i:#f2d27a;
  --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg-grad)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.appbar{background:var(--head);color:#fff;border-radius:0 0 24px 24px;box-shadow:0 8px 20px var(--head-shadow);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.appbar .topbar{max-width:560px;margin:0 auto}
.page{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 110px) max(16px,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 2px}
.topbar h1{flex:1;margin:0;font-family:var(--display);font-size:1.5rem;font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:rgb(255 255 255 / .22);display:grid;place-items:center;color:#fff;flex:none}
.iconbtn svg{width:22px;height:22px}

.hero{border-radius:24px;padding:18px 20px;background:var(--hero);color:var(--hero-ink);box-shadow:var(--hero-shadow);display:flex;flex-direction:column;gap:3px}
.hero .k{font-size:.82rem;opacity:.85}
.hero .v{font-family:var(--display);font-size:1.75rem;font-weight:700}
.hero .s{margin-top:6px;font-size:.85rem}

.banner{margin-top:12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:13px 14px;display:flex;gap:10px;align-items:center;font-size:.86rem;line-height:1.45}
.banner p{margin:0;flex:1}
.banner .x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:4px 6px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}

.h{font-family:var(--display);font-weight:700;font-size:1.12rem;margin:26px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h span{font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 4px;line-height:1.6}

.card{width:100%;text-align:left;border:0;background:var(--surface);border-radius:20px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.card .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .n{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.card .s{font-size:.8rem;color:var(--muted)}
.card .r{text-align:right;font-size:.78rem;color:var(--muted);flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.subj{display:inline-block;align-self:flex-start;border-radius:8px;padding:2px 8px;font-size:.72rem;font-weight:700}
.c0{background:var(--s0);color:var(--s0i)}.c1{background:var(--s1);color:var(--s1i)}.c2{background:var(--s2);color:var(--s2i)}.c3{background:var(--s3);color:var(--s3i)}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.b-today{background:var(--today-bg);color:var(--today-fg)}
.b-late{background:var(--late-bg);color:var(--late-fg)}
.b-soon{background:var(--soon-bg);color:var(--soon-fg)}
.b-done{background:var(--done-bg);color:var(--done-fg)}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--dot-off)}
.dots i.on{background:var(--accent)}
.dots i.now{background:none;box-shadow:inset 0 0 0 2px var(--accent)}

.due-row{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.due-row .card{box-shadow:none;border-radius:0}
.due-row .acts{display:grid;grid-template-columns:2fr 1fr;gap:8px;padding:0 12px 12px}
.pill{border:0;border-radius:99px;padding:11px 10px;font-weight:700;font-size:.92rem}
.pill.fill,.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 12px var(--green-shadow)}
.pill.tonal,.btn.orange{background:var(--orange);color:#fff;box-shadow:0 4px 12px var(--orange-shadow)}

.soon{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px}
.soon button{width:100%;border:0;background:none;text-align:left;display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.soon button:last-child{border-bottom:0}
.soon .when{flex:none;width:76px;font-size:.82rem;color:var(--accent);font-weight:700}
.soon .what{flex:1;min-width:0;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:7px 14px;font-size:.88rem;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.search{width:100%;border:0;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);padding:12px 18px;font-size:.95rem;margin-bottom:10px}
.search::placeholder{color:var(--muted)}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);border:0;border-radius:99px;background:var(--grad);color:#fff;font-weight:700;font-size:1rem;padding:15px 22px;box-shadow:0 8px 20px var(--grad-shadow);display:flex;align-items:center;gap:6px;z-index:5}

/* 새 창(전체 화면 시트) */
.sheet{position:fixed;inset:0;background:var(--bg-grad);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));
  background:var(--head);color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 16px var(--head-shadow);margin-bottom:12px}
.sheet header h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:1.3rem}
.back{border:0;background:none;color:#fff;width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.back svg{width:24px;height:24px}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.sheet .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

.title-block{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:4px 2px 4px}
.title-block .big{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.3;overflow-wrap:anywhere}
.title-block .dots i{width:14px;height:14px}
.memo{border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:13px 15px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.timeline{border-radius:20px;background:var(--surface);box-shadow:var(--shadow);padding:6px 16px;margin:0;list-style:none}
.timeline li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.timeline li:last-child{border-bottom:0}
.timeline .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--dot-off);color:var(--muted)}
.timeline li.done .no{background:var(--accent);color:var(--on-accent)}
.timeline li.now .no{background:var(--container);color:var(--on-container)}
.timeline .t{flex:1;min-width:0}
.timeline .t small{display:block;color:var(--muted);font-size:.78rem;margin-top:1px}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:99px;padding:14px 16px;font-weight:700;font-size:.97rem;text-align:center}
.btn.fill{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow)}
.btn.tonal{background:var(--container);color:var(--on-container)}
.btn.out{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--surface);color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.field{display:flex;flex-direction:column;gap:5px;background:var(--surface);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.field:focus-within{box-shadow:0 0 0 2px var(--accent)}
.field label{font-size:.76rem;color:var(--muted)}
.field input,.field textarea,.field select{border:0;background:none;padding:2px 0;font-size:1.02rem;outline:none;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px;line-height:1.5;font-size:.95rem}
.field.err{box-shadow:0 0 0 2px var(--danger)}
.errmsg{color:var(--danger);font-size:.8rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.88rem;background:var(--container);color:var(--on-container);border-radius:14px;padding:11px 14px;line-height:1.5}
.help{font-size:.82rem;color:var(--muted);line-height:1.55;margin:0 4px}
.sec{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:14px 2px 0}
.celebrate{text-align:center;border-radius:20px;background:var(--done-bg);color:var(--done-fg);padding:16px;font-weight:700}

.dialog-wrap{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{background:var(--bg);border-radius:26px;padding:22px 20px 16px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.dialog h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.2rem}
.dialog p{margin:0;font-size:.92rem;color:var(--muted);line-height:1.5;white-space:pre-line}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.dialog .acts button{border:0;background:none;color:var(--accent);font-weight:700;padding:10px 16px;border-radius:99px}
.dialog .acts button.go{background:var(--grad);color:#fff}
.dialog .acts button.go.danger{background:var(--danger);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:.9rem;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.toast button{border:0;background:none;color:var(--hero-a);font-weight:700;padding:2px}
.steps{margin:0;padding-left:1.3em;line-height:1.7;font-size:.92rem}
</style>
</head>
<body>
<header class="appbar">
  <div class="topbar">
    <h1>반복학습</h1>
    <button class="iconbtn" id="btnSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>
</header>
<div class="page">
  <div class="hero">
    <span class="k" id="heroDate"></span>
    <span class="v" id="heroHeadline"></span>
    <span class="s" id="heroSub"></span>
  </div>

  <div class="banner" id="installBanner" hidden>
    <p>홈 화면에 추가하면 앱처럼 아이콘을 눌러 바로 열 수 있어요.</p>
    <button class="linkbtn" id="btnInstallHow">방법 보기</button>
    <button class="x" id="btnInstallClose" aria-label="닫기">✕</button>
  </div>
  <div class="banner" id="sampleBanner" hidden>
    <p>지금 보이는 학습은 <b>예시</b>예요. 둘러본 뒤 지워 주세요.</p>
    <button class="linkbtn" id="btnClearSamples">예시 지우기</button>
  </div>

  <div class="h">오늘 복습할 것 <span id="dueCount"></span></div>
  <div class="list" id="dueList"></div>

  <div class="h" id="soonTitle">다가오는 복습 <span>7일 안</span></div>
  <div id="soonList"></div>

  <div class="h">전체 학습 <span id="allCount"></span></div>
  <div class="filters" id="filters"></div>
  <input class="search" id="search" type="search" placeholder="🔍 제목·메모 검색" autocomplete="off">
  <div class="list" id="allList"></div>
</div>

<button class="fab" id="fab"><span aria-hidden="true">＋</span> 공부한 것 등록</button>

<script>
"use strict";
/* ---------- 저장 ---------- */
const KEY = "review.v1";
const PRESETS = [
  { name: "기본", list: [1, 3, 7, 14, 30] },
  { name: "짧게", list: [1, 2, 4, 7] },
  { name: "길게", list: [1, 7, 16, 35, 60] },
];
const fresh = () => ({ intervals: [1, 3, 7, 14, 30], alarmHour: 8, items: [] });
let state = fresh();

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  if (!Array.isArray(state.items)) state.items = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast("저장에 실패했어요. 개인정보 보호(시크릿) 모드인지 확인해 주세요."); }
}

/* ---------- 날짜 ---------- */
const WD = "일월화수목금토";
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysUntil = s => { const a = parse(s), b = parse(todayStr());
  return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / 864e5); };
const pretty = s => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const short = s => { const d = daysUntil(s); return d === 0 ? "오늘" : d === 1 ? "내일" : d === 2 ? "모레" : pretty(s).replace(/ \(.\)$/, ""); };

/* ---------- 복습 일정 ----------
   n번째 복습일 = (첫 복습은 공부한 날, 그다음부터는 직전 복습을 실제로 한 날) + n번째 간격.
   늦게 복습해도 그날부터 다시 세므로 간격이 줄어들지 않는다. "헷갈려요"는 같은 차례를 내일 한 번 더 한다. */
const step = it => it.done.length;
const finished = it => step(it) >= it.intervals.length;
function dueDate(it) {
  if (finished(it)) return null;
  if (it.retry) return it.retry;
  const i = step(it);
  return addDays(i === 0 ? it.studied : it.done[i - 1], it.intervals[i]);
}
/** 남은 복습 예정일. 밀린 복습은 오늘 한다고 보고 그다음 날짜들을 센다. */
function projected(it) {
  const out = [], t = todayStr();
  let d = dueDate(it);
  for (let j = step(it); j < it.intervals.length; j++) {
    if (j > step(it)) d = addDays(d < t ? t : d, it.intervals[j]);
    out.push({ n: j + 1, date: d });
  }
  return out;
}
const isDue = it => !finished(it) && daysUntil(dueDate(it)) <= 0;
function complete(it) {
  const prev = { done: [...it.done], retry: it.retry };
  it.done.push(todayStr()); it.retry = "";
  save();
  return () => { it.done = prev.done; it.retry = prev.retry; save(); refreshAll(); };
}
function retryTomorrow(it) {
  const prev = it.retry; it.retry = addDays(todayStr(), 1); save();
  return () => { it.retry = prev; save(); refreshAll(); };
}
function streak() {
  const days = new Set(state.items.flatMap(it => it.done));
  let d = days.has(todayStr()) ? todayStr() : addDays(todayStr(), -1), n = 0;
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- 공통 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const find = id => state.items.find(x => x.id === id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
function hash(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) | 0; return Math.abs(h); }
const subjects = () => [...new Set(state.items.map(it => it.subject).filter(Boolean))].sort();
const subjTag = s => s ? `<span class="subj c${hash(s) % 4}">${esc(s)}</span>` : "";
const dots = it => `<span class="dots" aria-label="${it.intervals.length}번 중 ${step(it)}번 복습">${it.intervals.map((_, i) =>
  `<i class="${i < step(it) ? "on" : i === step(it) ? "now" : ""}"></i>`).join("")}</span>`;
function statusBadge(it) {
  if (finished(it)) return `<span class="badge b-done">완료 🎉</span>`;
  const d = daysUntil(dueDate(it));
  if (d < 0) return `<span class="badge b-late">${-d}일 밀림</span>`;
  if (d === 0) return `<span class="badge b-today">오늘</span>`;
  return `<span class="badge b-soon">${d === 1 ? "내일" : `D-${d}`}</span>`;
}
const stepText = it => finished(it) ? `${it.intervals.length}번 복습 모두 끝` : `${step(it) + 1}번째 복습 · ${it.retry ? "다시 보기" : `${it.intervals[step(it)]}일 간격`}`;
const sortByDue = (a, b) => (dueDate(a) || "9999").localeCompare(dueDate(b) || "9999") || a.title.localeCompare(b.title);

let toastTimer;
function toast(text, undo) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button type="button">되돌리기</button>' : ""}`;
  if (undo) t.querySelector("button").onclick = () => { undo(); t.remove(); toast("되돌렸어요"); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), undo ? 6000 : 2600);
}
function confirmBox({ title, msg, ok = "확인", danger = false, onOk }) {
  const w = document.createElement("div");
  w.className = "dialog-wrap";
  w.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ""}
    <div class="acts"><button type="button" data-a="no">취소</button><button type="button" class="go ${danger ? "danger" : ""}" data-a="ok">${esc(ok)}</button></div></div>`;
  w.addEventListener("click", e => {
    const a = e.target.dataset.a;
    if (e.target === w || a === "no") w.remove();
    if (a === "ok") { w.remove(); onOk(); }
  });
  document.body.appendChild(w);
  w.querySelector(".go").focus();
}

/* ---------- 새 창(시트): 휴대폰 뒤로가기 버튼으로도 닫힌다 ---------- */
const stack = [];
const BACK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>';
function openSheet(title, html, mount, refresh) {
  const s = document.createElement("section");
  s.className = "sheet"; s.setAttribute("role", "dialog"); s.setAttribute("aria-label", title);
  s.innerHTML = `<header><button class="back" type="button" aria-label="뒤로">${BACK_SVG}</button><h2>${esc(title)}</h2></header>
    <div class="body"><div class="inner">${html}</div></div>`;
  s.querySelector(".back").onclick = () => history.back();
  document.body.appendChild(s);
  stack.push({ el: s, refresh });
  history.pushState({ sheet: stack.length }, "");
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add("open")));
  mount?.(s);
  return s;
}
function popSheet() {
  const top = stack.pop();
  if (!top) return;
  top.el.classList.remove("open");
  setTimeout(() => top.el.remove(), 280);
  refreshAll();
}
window.addEventListener("popstate", popSheet);
const closeSheet = () => history.back();
function refreshAll() { renderHome(); for (const s of stack) s.refresh?.(); }

/* ---------- 메인 화면 ---------- */
let filter = "";
function renderHome() {
  const now = new Date();
  const due = state.items.filter(isDue).sort(sortByDue);
  const doneToday = state.items.reduce((n, it) => n + it.done.filter(d => d === todayStr()).length, 0);
  const st = streak();
  $("#heroDate").textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${WD[now.getDay()]}요일${doneToday ? ` · 오늘 ${doneToday}개 복습함` : ""}`;
  $("#heroHeadline").textContent = due.length ? `오늘 복습 ${due.length}개` : state.items.length ? "오늘 복습 끝! 👏" : "반복학습 시작하기";
  $("#heroSub").textContent = st ? `🔥 ${st}일 연속 복습 중` : state.items.length ? "오늘 한 개만 복습해도 연속 기록이 시작돼요" : "공부한 것을 등록하면 복습할 날을 알려 드려요";
  $("#sampleBanner").hidden = !state.items.some(it => it.sample);

  $("#dueCount").textContent = `${due.length}개`;
  $("#dueList").innerHTML = due.length ? due.map(it => `
    <div class="due-row">
      <button class="card" type="button" data-open="${it.id}">
        <span class="l">${subjTag(it.subject)}<span class="n">${esc(it.title)}</span><span class="s">${stepText(it)}</span></span>
        <span class="r">${statusBadge(it)}${dots(it)}</span>
      </button>
      <div class="acts"><button class="pill fill" type="button" data-done="${it.id}">✓ 복습 완료</button><button class="pill tonal" type="button" data-retry="${it.id}">헷갈려요</button></div>
    </div>`).join("") : `<div class="empty">${state.items.length ? "오늘 복습할 것이 없어요. 새로 공부한 것을 등록해 보세요." : "아직 등록된 학습이 없어요."}</div>`;

  const soon = state.items.filter(it => !finished(it) && daysUntil(dueDate(it)) >= 1 && daysUntil(dueDate(it)) <= 7).sort(sortByDue);
  $("#soonTitle").hidden = $("#soonList").hidden = !soon.length;
  $("#soonList").innerHTML = soon.length ? `<div class="soon">${soon.map(it => `
    <button type="button" data-open="${it.id}"><span class="when">${short(dueDate(it))}</span><span class="what">${esc(it.title)}</span>${dots(it)}</button>`).join("")}</div>` : "";

  const subs = subjects();
  if (filter && !subs.includes(filter)) filter = "";
  $("#filters").hidden = !subs.length;
  $("#filters").innerHTML = [["", "전체"], ...subs.map(s => [s, s])].map(([v, l]) =>
    `<button class="chip ${filter === v ? "on" : ""}" type="button" data-filter="${esc(v)}">${esc(l)}</button>`).join("");
  const q = $("#search").value.trim();
  const list = state.items.filter(it => (!filter || it.subject === filter) && (!q || it.title.includes(q) || (it.memo || "").includes(q)))
    .sort((a, b) => finished(a) - finished(b) || sortByDue(a, b));
  $("#allCount").textContent = `${state.items.length}개`;
  $("#allList").innerHTML = list.length ? list.map(it => `
    <button class="card" type="button" data-open="${it.id}">
      <span class="l">${subjTag(it.subject)}<span class="n">${esc(it.title)}</span><span class="s">${finished(it) ? stepText(it) : `다음 복습 ${pretty(dueDate(it))}`}</span></span>
      <span class="r">${statusBadge(it)}${dots(it)}</span>
    </button>`).join("")
    : state.items.length ? `<div class="empty">맞는 학습이 없어요.</div>`
    : `<div class="empty">아래 <b>＋ 공부한 것 등록</b>을 눌러 오늘 공부한 것을 적어 보세요.<br>
       <button class="linkbtn" type="button" id="btnSamples">예시로 둘러보기</button></div>`;
}

document.addEventListener("click", e => {
  const t = e.target;
  const done = t.closest("[data-done]"), retry = t.closest("[data-retry]");
  if (done || retry) {
    const it = find((done || retry).dataset.done || (done || retry).dataset.retry);
    if (!it) return;
    if (done) {
      const undo = complete(it); refreshAll();
      toast(finished(it) ? `‘${it.title}’ 복습을 모두 끝냈어요 🎉` : `다음 복습은 ${pretty(dueDate(it))}이에요`, undo);
    } else {
      const undo = retryTomorrow(it); refreshAll();
      toast("내일 한 번 더 복습하도록 넣었어요", undo);
    }
    return;
  }
  const open = t.closest("[data-open]");
  if (open && !open.closest(".sheet")) { openDetail(open.dataset.open); return; }
  const f = t.closest("[data-filter]");
  if (f) { filter = f.dataset.filter; renderHome(); return; }
  if (t.id === "btnSamples") addSamples();
});
$("#search").addEventListener("input", renderHome);
$("#fab").onclick = () => openEdit(null);
$("#btnSettings").onclick = openSettings;
$("#btnClearSamples").onclick = () => confirmBox({ title: "예시 학습을 지울까요?", msg: "직접 등록한 학습은 그대로 남아요.", ok: "지우기",
  onOk: () => { state.items = state.items.filter(it => !it.sample); save(); renderHome(); toast("예시를 지웠어요"); } });

function addSamples() {
  const t = todayStr();
  const mk = (title, subject, studiedAgo, doneAgo, memo) => ({ id: uid(), sample: true, title, subject, memo,
    studied: addDays(t, -studiedAgo), intervals: [1, 3, 7, 14, 30], done: doneAgo.map(n => addDays(t, -n)), retry: "" });
  state.items.push(
    mk("영어 단어 Day 3 (50개)", "영어", 1, [], "헷갈린 단어: accommodate, necessary"),
    mk("한국사 조선 전기 정치", "한국사", 5, [4], "태조~성종, 경국대전 완성"),
    mk("미적분 극한 기본 문제", "수학", 12, [11, 8], ""),
    mk("영어 단어 Day 1 (50개)", "영어", 3, [2], ""),
  );
  save(); renderHome();
}

/* ---------- 학습 상세 ---------- */
function openDetail(id) {
  let s;
  const render = () => {
    const it = find(id);
    if (!it) { closeSheet(); return; }
    const due = dueDate(it), plan = projected(it);
    const rows = it.intervals.map((gap, i) => {
      if (i < it.done.length) return `<li class="done"><span class="no">${i + 1}</span><span class="t">${i + 1}번째 복습 · ${pretty(it.done[i])}<small>✓ 완료 · ${gap}일 간격</small></span></li>`;
      const p = plan.find(x => x.n === i + 1);
      const d = daysUntil(p.date);
      const tag = i === step(it) ? (d < 0 ? `<span class="badge b-late">${-d}일 밀림</span>` : d === 0 ? `<span class="badge b-today">오늘</span>` : "") : "";
      return `<li class="${i === step(it) ? "now" : ""}"><span class="no">${i + 1}</span><span class="t">${i + 1}번째 복습 · ${pretty(p.date)}<small>${i === step(it) && it.retry ? "헷갈려서 다시 보기" : `${gap}일 간격`}${i > step(it) ? " · 예정" : ""}</small></span>${tag}</li>`;
    }).join("");
    s.querySelector(".inner").innerHTML = `
      <div class="title-block">${subjTag(it.subject)}<div class="big">${esc(it.title)}</div>${dots(it)}
        <span class="help" style="margin:0">${pretty(it.studied)}에 공부함 · ${stepText(it)}</span></div>
      ${it.memo ? `<div class="memo">${esc(it.memo)}</div>` : ""}
      ${finished(it) ? `<div class="celebrate">🎉 ${it.intervals.length}번 복습을 모두 끝냈어요! 오래 기억에 남을 거예요.</div>` : ""}
      ${due && daysUntil(due) <= 0 ? `<div class="row2" style="grid-template-columns:2fr 1fr"><button class="btn green" type="button" data-act="done">✓ 복습 완료</button><button class="btn orange" type="button" data-act="retry">헷갈려요</button></div>` : ""}
      ${due && daysUntil(due) > 0 ? `<button class="btn green" type="button" data-act="done">✓ 오늘 미리 복습했어요</button>` : ""}
      <div class="sec">복습 일정</div>
      <ol class="timeline">${rows}</ol>
      ${!finished(it) ? `<button class="btn out" type="button" data-act="cal">📅 남은 복습을 휴대폰 캘린더에 등록</button>` : ""}
      <div class="row2"><button class="btn out" type="button" data-act="edit">수정</button><button class="btn out" type="button" data-act="reset">처음부터 다시</button></div>
      <button class="btn danger" type="button" data-act="del">삭제</button>`;
  };
  s = openSheet("학습 정보", "", el => el.addEventListener("click", e => {
    const a = e.target.closest("[data-act]")?.dataset.act, it = find(id);
    if (!a || !it) return;
    if (a === "done") { const undo = complete(it); refreshAll(); toast(finished(it) ? "복습을 모두 끝냈어요 🎉" : `다음 복습은 ${pretty(dueDate(it))}이에요`, undo); }
    if (a === "retry") { const undo = retryTomorrow(it); refreshAll(); toast("내일 한 번 더 복습하도록 넣었어요", undo); }
    if (a === "cal") downloadIcs([it], `${it.title}-복습.ics`);
    if (a === "edit") openEdit(it.id);
    if (a === "reset") confirmBox({ title: "처음부터 다시 할까요?", msg: "복습 기록을 지우고, 오늘 공부한 것으로 다시 시작해요.", ok: "다시 시작",
      onOk: () => { it.done = []; it.retry = ""; it.studied = todayStr(); save(); refreshAll(); toast(`첫 복습은 ${pretty(dueDate(it))}이에요`); } });
    if (a === "del") confirmBox({ title: "이 학습을 삭제할까요?", msg: `‘${it.title}’과 복습 기록이 모두 지워져요.`, ok: "삭제", danger: true,
      onOk: () => { state.items = state.items.filter(x => x.id !== it.id); save(); closeSheet(); toast("삭제했어요"); } });
  }), () => render());
  render();
}

/* ---------- 등록·수정 ---------- */
const parseIntervals = s => {
  const a = String(s).split(/[^\d]+/).filter(Boolean).map(Number).filter(n => n >= 1 && n <= 365);
  return a.length && a.length <= 12 ? a : null;
};
function openEdit(id) {
  const e = id ? find(id) : null;
  const v = e || { title: "", subject: filter || "", studied: todayStr(), intervals: state.intervals, memo: "" };
  const subs = subjects();
  openSheet(e ? "학습 수정" : "공부한 것 등록", `
    <div class="field" data-f="title"><label for="fTitle">무엇을 공부했나요?</label><input id="fTitle" autocomplete="off" placeholder="예: 영어 단어 Day 4, 수학 2단원" value="${esc(v.title)}"></div>
    <div class="field"><label for="fSubj">과목·분류 (선택)</label><input id="fSubj" autocomplete="off" list="subjList" placeholder="예: 영어" value="${esc(v.subject)}">
      <datalist id="subjList">${subs.map(s => `<option value="${esc(s)}">`).join("")}</datalist></div>
    ${subs.length ? `<div class="chips">${subs.map(s => `<button class="chip" type="button" data-subj="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
    <div class="field"><label for="fDate">공부한 날</label><input id="fDate" type="date" value="${v.studied}"></div>
    <div class="field" data-f="iv"><label for="fIv">복습 간격 (일)</label><input id="fIv" inputmode="numeric" value="${v.intervals.join(", ")}"></div>
    <div class="chips">${PRESETS.map(p => `<button class="chip" type="button" data-iv="${p.list.join(", ")}">${p.name} ${p.list.join("·")}</button>`).join("")}</div>
    <div class="hint" id="fPrev"></div>
    <div class="field"><label for="fMemo">메모 (선택)</label><textarea id="fMemo" rows="3" placeholder="헷갈린 부분, 페이지 등">${esc(v.memo)}</textarea></div>
    <div class="errmsg" id="fErr" hidden></div>
    <button class="btn fill" type="button" id="fSave">저장</button>`, s => {
    const q = sel => s.querySelector(sel);
    const upd = () => {
      const iv = parseIntervals(q("#fIv").value), d = q("#fDate").value;
      s.querySelectorAll("[data-iv]").forEach(b => b.classList.toggle("on", iv && b.dataset.iv === iv.join(", ")));
      s.querySelectorAll("[data-subj]").forEach(b => b.classList.toggle("on", b.dataset.subj === q("#fSubj").value.trim()));
      if (!iv) { q("#fPrev").textContent = "간격은 숫자를 쉼표로 나눠 적어 주세요. 예: 1, 3, 7, 14, 30"; return; }
      if (!d) { q("#fPrev").textContent = "공부한 날을 골라 주세요."; return; }
      let cur = d;
      const dates = iv.map(n => (cur = addDays(cur, n)));
      q("#fPrev").textContent = `복습 ${iv.length}번: ${dates.map(short).join(" → ")}`;
    };
    s.querySelectorAll("[data-iv]").forEach(b => b.onclick = () => { q("#fIv").value = b.dataset.iv; upd(); });
    s.querySelectorAll("[data-subj]").forEach(b => b.onclick = () => { q("#fSubj").value = b.dataset.subj; upd(); });
    ["#fIv", "#fDate", "#fSubj"].forEach(sel => q(sel).addEventListener("input", upd)); upd();
    q("#fSave").onclick = () => {
      const title = q("#fTitle").value.trim(), iv = parseIntervals(q("#fIv").value), studied = q("#fDate").value;
      q('[data-f="title"]').classList.toggle("err", !title); q('[data-f="iv"]').classList.toggle("err", !iv);
      const msgs = [!title && "무엇을 공부했는지 적어 주세요", !iv && "복습 간격을 확인해 주세요", !studied && "공부한 날을 골라 주세요"].filter(Boolean);
      q("#fErr").hidden = !msgs.length; q("#fErr").textContent = msgs.join(" · ");
      if (msgs.length) return;
      const data = { title, subject: q("#fSubj").value.trim(), studied, intervals: iv, memo: q("#fMemo").value.trim() };
      if (e) { Object.assign(e, data); e.done = e.done.slice(0, iv.length); }
      else state.items.push({ id: uid(), ...data, done: [], retry: "" });
      save(); closeSheet();
      const it = e || state.items[state.items.length - 1];
      toast(e ? "수정했어요" : `첫 복습은 ${pretty(dueDate(it))}이에요`);
    };
    if (!e) setTimeout(() => q("#fTitle").focus(), 300);
  });
}

/* ---------- 캘린더(.ics): 복습하는 날 정해진 시각에 휴대폰이 알려 준다 ---------- */
function downloadIcs(items, name) {
  const now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const text = s => s.replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const h = pad(state.alarmHour), events = [];
  for (const it of items) for (const p of projected(it)) {
    const d = (p.date < todayStr() ? todayStr() : p.date).replaceAll("-", "");
    events.push("BEGIN:VEVENT", `UID:${it.id}-${p.n}-${d}@review-web`, `DTSTAMP:${now}`,
      `DTSTART:${d}T${h}0000`, `DTEND:${d}T${h}1500`,
      `SUMMARY:${text(`📚 복습 ${p.n}/${it.intervals.length}: ${it.title}`)}`,
      `DESCRIPTION:${text("반복학습 앱을 열어 복습하고 ‘복습 완료’를 눌러 주세요.")}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${text(`복습할 시간이에요: ${it.title}`)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
  }
  if (!events.length) { toast("등록할 남은 복습이 없어요"); return; }
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//review-web//KO", "CALSCALE:GREGORIAN", ...events, "END:VCALENDAR"].join("\r\n");
  download(new File([ics], name, { type: "text/calendar" }));
  toast(`캘린더 파일을 열고 ‘추가’를 누르면, 복습하는 날 ${state.alarmHour}시에 휴대폰이 알려 줘요.`);
}
function download(file) {
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
/** 휴대폰에서는 공유 창(파일에 저장·카카오톡 등)을 먼저 띄우고, 안 되면 내려받는다. */
async function shareOrDownload(file, after) {
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); toast(after); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  download(file); toast(after);
}

/* ---------- 설정 ---------- */
function openSettings() {
  openSheet("설정", `
    <div class="sec" style="margin-top:0">기본 복습 간격</div>
    <p class="help">새로 등록할 때 처음 채워지는 간격이에요. 이미 등록한 학습은 바뀌지 않아요.</p>
    <div class="field"><label for="sIv">복습 간격 (일)</label><input id="sIv" inputmode="numeric" value="${state.intervals.join(", ")}"></div>
    <div class="chips">${PRESETS.map(p => `<button class="chip" type="button" data-iv="${p.list.join(", ")}">${p.name} ${p.list.join("·")}</button>`).join("")}</div>
    <div class="field"><label for="sHour">캘린더 알림 시각</label><select id="sHour">${Array.from({ length: 17 }, (_, i) => i + 6).map(h =>
      `<option value="${h}" ${h === state.alarmHour ? "selected" : ""}>${h < 12 ? "오전" : "오후"} ${h > 12 ? h - 12 : h}시</option>`).join("")}</select></div>
    <div class="errmsg" id="sErr" hidden>간격은 숫자를 쉼표로 나눠 적어 주세요. 예: 1, 3, 7, 14, 30</div>
    <button class="btn fill" type="button" id="sSave">설정 저장</button>

    <div class="sec">캘린더 알림</div>
    <p class="help">남은 복습 날짜를 모두 휴대폰 캘린더에 넣어요. 늦게 복습하면 날짜가 바뀌니, 그럴 땐 다시 등록해 주세요.</p>
    <button class="btn out" type="button" id="sCal">📅 모든 복습을 캘린더에 등록</button>

    <div class="sec">데이터 백업</div>
    <p class="help">학습 기록은 이 휴대폰 안에만 저장돼요. 휴대폰을 바꾸기 전에 백업 파일을 저장해 두세요.</p>
    <div class="row2"><button class="btn out" type="button" id="sExport">백업 저장</button><button class="btn out" type="button" id="sImport">백업 불러오기</button></div>
    <input type="file" id="sFile" accept=".json,application/json" hidden>

    <div class="sec">홈 화면에 추가</div>
    <button class="btn out" type="button" id="sHow">방법 보기</button>

    <div class="sec">초기화</div>
    <button class="btn danger" type="button" id="sWipe">모든 데이터 지우기</button>`, s => {
    const q = sel => s.querySelector(sel);
    s.querySelectorAll("[data-iv]").forEach(b => b.onclick = () => { q("#sIv").value = b.dataset.iv; });
    q("#sSave").onclick = () => {
      const iv = parseIntervals(q("#sIv").value);
      q("#sErr").hidden = !!iv;
      if (!iv) return;
      state.intervals = iv; state.alarmHour = +q("#sHour").value;
      save(); closeSheet(); toast("저장했어요");
    };
    q("#sCal").onclick = () => downloadIcs(state.items.filter(it => !finished(it)), `반복학습-복습일정-${todayStr()}.ics`);
    q("#sExport").onclick = () => shareOrDownload(
      new File([JSON.stringify({ app: "review-web", version: 1, savedAt: new Date().toISOString(), ...state }, null, 2)], `반복학습-백업-${todayStr()}.json`, { type: "application/json" }),
      "백업 파일을 저장했어요. 카카오톡 ‘나와의 채팅’이나 클라우드에도 보관해 두세요.");
    q("#sImport").onclick = () => q("#sFile").click();
    q("#sFile").onchange = async ev => {
      const f = ev.target.files[0]; ev.target.value = "";
      if (!f) return;
      let data;
      try { data = JSON.parse(await f.text()); if (!Array.isArray(data.items)) throw 0; }
      catch { toast("백업 파일을 읽을 수 없어요"); return; }
      confirmBox({ title: "백업 불러오기", msg: `학습 ${data.items.length}개가 들어 있는 백업으로 바꿔요.\n지금 있는 기록은 지워져요.`, ok: "불러오기",
        onOk: () => {
          state = { intervals: parseIntervals((data.intervals || []).join(",")) || fresh().intervals, alarmHour: data.alarmHour || 8, items: data.items };
          save(); closeSheet(); toast(`학습 ${data.items.length}개를 불러왔어요`);
        } });
    };
    q("#sHow").onclick = openInstallHow;
    q("#sWipe").onclick = () => confirmBox({ title: "모든 데이터를 지울까요?", msg: "학습과 복습 기록이 모두 지워지고 되돌릴 수 없어요.\n먼저 백업을 저장해 두는 걸 권해요.", ok: "모두 지우기", danger: true,
      onOk: () => { state = fresh(); save(); closeSheet(); toast("모든 데이터를 지웠어요"); } });
  });
}

/* ---------- 홈 화면에 추가 안내 ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function openInstallHow() {
  const android = `<ol class="steps"><li>크롬 또는 삼성 인터넷으로 이 페이지를 엽니다.</li><li>오른쪽 위 <b>⋮</b> (삼성 인터넷은 아래 <b>☰</b>) 메뉴를 누릅니다.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누릅니다.</li></ol>`;
  const ios = `<ol class="steps"><li><b>사파리</b>로 이 페이지를 엽니다.</li><li>아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누릅니다.</li><li><b>홈 화면에 추가</b>를 누르고 오른쪽 위 <b>추가</b>를 누릅니다.</li></ol>`;
  openSheet("홈 화면에 추가", `
    ${installEvt ? `<button class="btn fill" type="button" id="iNow">지금 바로 설치하기</button>` : ""}
    <div class="sec">${isIOS ? "아이폰" : "안드로이드(갤럭시)"}</div>${isIOS ? ios : android}
    <div class="sec">${isIOS ? "안드로이드(갤럭시)" : "아이폰"}</div>${isIOS ? android : ios}
    <p class="help">추가하고 나면 홈 화면의 <b>반복학습</b> 아이콘으로 열어 주세요. 아이폰은 사파리와 홈 화면 앱의 기록이 따로 저장돼요.</p>`, s => {
    const b = s.querySelector("#iNow");
    if (b) b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; closeSheet(); };
  });
}
$("#btnInstallHow").onclick = openInstallHow;
$("#btnInstallClose").onclick = () => { $("#installBanner").hidden = true; try { localStorage.setItem("review.hideInstall", "1"); } catch {} };

/* ---------- 시작 ---------- */
load();
renderHome();
try { $("#installBanner").hidden = standalone() || localStorage.getItem("review.hideInstall") === "1"; } catch { $("#installBanner").hidden = standalone(); }
navigator.storage?.persist?.().catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// 날짜가 바뀌거나 다른 앱에서 돌아오면 다시 그린다
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
</script>
